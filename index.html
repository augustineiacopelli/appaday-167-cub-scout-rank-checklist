.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px)}

.field{display:grid;gap:6px;margin-top:10px}
.field label{font-size:var(--fs-xs);font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>

/* ---------- pure progress logic ---------- */
function tally(rankId, adv, scout){
  var checks = scout.checks || {}, met = 0, total = 0, dates = [];
  adv.reqs.forEach(function(r){
    if (r.group) return;
    total++;
    var c = checks[ckey(rankId, adv.id, r.n)];
    if (c) { met++; dates.push(c.date); }
  });
  adv.groups.forEach(function(g){
    var got = [];
    adv.reqs.forEach(function(r){ if (r.group === g.id) { var c = checks[ckey(rankId, adv.id, r.n)]; if (c) got.push(c.date); } });
    got.sort();
    met += Math.min(got.length, g.count); total += g.count;
    if (got.length >= g.count) dates.push(got[g.count - 1]); else dates = dates.concat(got);
  });
  dates.sort();
  return {met:met, total:total, latest:dates.length ? dates[dates.length - 1] : ""};
}
function altFor(rankId, adv, scout){ var a = (scout.alts || {})[akey(rankId, adv.id)]; return a && adv.alts.indexOf(a.type) >= 0 ? a : null; }

function adventureProgress(rankId, adv, scout){
  if (altFor(rankId, adv, scout)) return 1;
  var t = tally(rankId, adv, scout); return t.total ? t.met / t.total : 0;
}
function adventureDate(rankId, adv, scout){
  var t = tally(rankId, adv, scout), a = altFor(rankId, adv, scout);
  if (t.total && t.met === t.total) return a && a.date < t.latest ? a.date : t.latest;

function electiveSlots(rank, scout){

  });

function cleanScout(s){

var sheetMode = null;
function openSheet(html, mode){ var sh = document.getElementById("sheet"); sh.innerHTML = html; sheetMode = mode; document.getElementById("scrim").classList.add("open"); var f = sh.querySelector("[autofocus]"); if (f) f.focus(); }
function closeSheet(){ document.getElementById("scrim").classList.remove("open"); clearKids(document.getElementById("sheet")); sheetMode = null; dialogCb = null; }
var dialogCb = null;
function confirmBox(msg, okLabel, cb, danger){
  dialogCb = cb;
  openSheet('<div class="dialog"><div class="sheethead"><h2>Please confirm</h2></div><p class="msg">' + esc(msg) + '</p>' +
    '<div class="btnrow"><button class="btn ' + (danger ? "danger" : "primary") + '" data-act="dialog-ok">' + esc(okLabel) + '</button><button class="btn" data-act="sheet-close">Cancel</button></div></div>', "dialog");
}

/* ---------- rendering ---------- */
function ringSvg(p, ok){
  var r = 18, c = 2 * Math.PI * r, off = c * (1 - p);
  return '<svg class="ring' + (ok ? " ok" : "") + '" viewBox="0 0 44 44" aria-hidden="true"><circle class="bg" cx="22" cy="22" r="' + r + '"/><circle class="fg" cx="22" cy="22" r="' + r +
    '" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '"/><text x="22" y="26" text-anchor="middle">' + (ok ? "&#10003;" : Math.round(p * 100)) + '</text></svg>';
}
function render(){
  renderChips(); renderSeg();
  var v = document.getElementById("view"), s = active();
  if (!s) { v.innerHTML = '<div class="card empty"><div class="big">Track every Cub Scout rank</div><p class="muted">Add a Scout to start checking off requirements from Lion through Arrow of Light. Everything stays on this device.</p><button class="btn primary" data-act="settings-add">Add your first Scout</button></div>'; return; }
  if (!ui.rankId) ui.rankId = s.rankId;
  var rank = rankById(ui.rankId); v.style.setProperty("--rk", rank.color);
  if (ui.view === "summary") v.innerHTML = viewSummary();
  else if (ui.view === "rank") v.innerHTML = viewRank(s, rank);
  else if (ui.view === "adventure") v.innerHTML = viewAdventure(s, rank);
  else v.innerHTML = viewQueue(s);
}
function renderChips(){
  var h = state.scouts.map(function(s){
    return '<button class="chip" data-act="scout" data-id="' + esc(s.id) + '" aria-pressed="' + (s.id === state.activeScoutId) + '"><span class="dot" style="background:' + rankById(s.rankId).color + '"></span>' + esc(s.name) + '</button>';
  }).join("");
  document.getElementById("chips").innerHTML = h + '<button class="chip add" data-act="settings-add">+ Scout</button>';
}
function renderSeg(){
  var s = active(), q = s ? queueCount(s) : 0;
  Array.prototype.forEach.call(document.querySelectorAll("#seg button"), function(b){
    b.setAttribute("aria-selected", b.getAttribute("data-v") === ui.view);
    if (b.getAttribute("data-v") === "queue") b.innerHTML = "Queue" + (q ? '<span class="badge">' + q + "</span>" : "");
  });
}
function viewSummary(){
  return '<div class="stack">' + state.scouts.map(function(s){
    var rank = rankById(s.rankId), rp = rankProgress(rank, s), q = queueCount(s);
    var minis = CATALOG.map(function(r){ var p = rankProgress(r, s); return '<div class="mini"><div class="bar" style="--rk:' + r.color + '"><i style="width:' + Math.round(p.fraction * 100) + '%"></i></div>' + esc(r.id === "aol" ? "AOL" : r.name) + '</div>'; }).join("");
    return '<button class="card scoutcard" data-act="open-scout" data-id="' + esc(s.id) + '" style="--rk:' + rank.color + '"><div class="row"><span class="name">' + esc(s.name) + '</span><span class="rankbadge">' + esc(rank.name) + ' den</span></div>' +
      '<div class="row small muted" style="margin:10px 0 6px"><span>' + rp.reqMet + ' of ' + rp.reqTotal + ' required, ' + rp.elMet + ' of 2 electives</span>' + (rp.complete ? '<span class="stamp">Complete</span>' : '<span>' + Math.round(rp.fraction * 100) + '%</span>') + '</div>' +
      '<div class="bar"><i style="width:' + Math.round(rp.fraction * 100) + '%"></i></div>' +
      '<div class="small" style="margin-top:10px;color:' + (q ? "var(--warn)" : "var(--ok)") + '">' + (q ? q + " item" + (q === 1 ? "" : "s") + " waiting for Scoutbook" : "Scoutbook is up to date") + '</div>' +
      '<div class="minis">' + minis + '</div></button>';
  }).join("") + '</div>';
}
function advCard(s, rank, a, withPin){
  var p = adventureProgress(rank.id, a, s), met = requirementsMet(rank.id, a, s), d = met ? adventureDate(rank.id, a, s) : "";
  var alt = altFor(rank.id, a, s);
  var sub = met ? "Complete " + fmtDate(d) + (alt ? " (" + ALT_SHORT[alt.type] + ")" : "") : tally(rank.id, a, s).met + " of " + tally(rank.id, a, s).total + " requirements";
  var card = '<button class="adv' + (met ? " done" : "") + '" data-act="open-adv" data-id="' + a.id + '">' + ringSvg(p, met) + '<span class="main"><span class="nm">' + esc(a.name) + '</span><span class="sub" style="display:block">' + esc(sub) + '</span></span></button>';
  if (!withPin) return card;
  var pins = (s.chosenElectives[rank.id] || []), on = pins.indexOf(a.id) >= 0;
  return '<div class="advwrap">' + card + '<button class="pin" data-act="pin" data-id="' + a.id + '" aria-pressed="' + on + '" aria-label="' + (on ? "Unpin " : "Pin ") + esc(a.name) + '"><svg viewBox="0 0 24 24" fill="' + (on ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7-6.2-3.6-6.2 3.6 1.4-7L2 9.3l7-.8z"/></svg></button></div>';
}
function viewRank(s, rank){
  var rp = rankProgress(rank, s);
  var pick = '<div class="rankpick" role="group" aria-label="Rank">' + CATALOG.map(function(r){ return '<button style="--c:' + r.color + '" data-act="rank" data-id="' + r.id + '" aria-pressed="' + (r.id === rank.id) + '">' + esc(r.name) + '</button>'; }).join("") + '</div>';
  var head = '<div class="card rankhead" style="margin-top:12px"><div class="top"><div><h2>' + esc(rank.name) + '</h2><div class="small muted">' + esc(rank.grade) + ' &middot; six required plus two electives</div></div>' + (rp.complete ? '<span class="stamp">Complete</span>' : '<span class="rankbadge">' + Math.round(rp.fraction * 100) + '%</span>') + '</div>' +
    '<div class="bar" style="margin:12px 0 8px"><i style="width:' + Math.round(rp.fraction * 100) + '%"></i></div><div class="small muted">' + rp.reqMet + ' of ' + rp.reqTotal + ' required adventures, ' + rp.elMetAll + ' elective' + (rp.elMetAll === 1 ? "" : "s") + ' complete</div>' +
    '<div class="btnrow">' + (s.rankId !== rank.id ? '<button class="btn rk" data-act="set-rank" data-id="' + rank.id + '">Move ' + esc(s.name) + ' to the ' + esc(rank.name) + ' den</button>' : '') +
    '<a class="btn ghost" href="' + rank.url + '" target="_blank" rel="noopener">Official requirements</a></div></div>';
  var req = rank.adventures.filter(function(a){ return a.type === "required"; }).map(function(a){ return '<h3>' + esc(FOCI[a.focus]) + '</h3>' + advCard(s, rank, a, false); }).join("");
  var el = rank.adventures.filter(function(a){ return a.type === "elective"; }).map(function(a){ return advCard(s, rank, a, true); }).join("");
  return pick + head + '<div>' + req + '</div><h3>Electives &middot; pin the two you are working on</h3><div class="advlist">' + el + '</div>';
}
function viewAdventure(s, rank){
  var a = ui.advId ? advById(rank, ui.advId) : null;
  if (!a) return '<div class="card empty"><div class="big">Pick an adventure</div><p class="muted">Open the Rank tab and tap any adventure to check off its requirements.</p><button class="btn primary" data-act="view" data-v="rank">Go to ' + esc(rank.name) + '</button></div>';
  var met = requirementsMet(rank.id, a, s), p = adventureProgress(rank.id, a, s), t = tally(rank.id, a, s), alt = altFor(rank.id, a, s), td = today();
  var h = '<button class="btn ghost" data-act="view" data-v="rank">&larr; ' + esc(rank.name) + ' adventures</button>' +
    '<div class="card rankhead" style="margin-top:8px"><div class="top"><div><h2>' + esc(a.name) + '</h2><div class="small muted">' + esc(rank.name) + ' &middot; ' + (a.type === "required" ? "Required, " + esc(FOCI[a.focus]) : "Elective") + '</div></div>' + ringSvg(p, met) + '</div>' +
    '<div class="small" style="margin-top:8px;color:' + (met ? "var(--ok)" : "var(--ink-2)") + '">' + (met ? "Adventure complete " + fmtDate(adventureDate(rank.id, a, s)) : t.met + " of " + t.total + " requirements done") + '</div>';
  if (a.note) h += '<div class="small muted" style="margin-top:6px">' + esc(a.note) + '</div>';
  if (a.alts.length) {
    h += '<div class="alts">';
    a.alts.forEach(function(type){
      var on = alt && alt.type === type;
      h += '<div class="altrow' + (on ? " on" : "") + '"><span class="lbl">' + (on ? "" : "Or: ") + esc(ALT_LABEL[type]) + (on && alt.entered ? ' <span class="tag">In Scoutbook</span>' : '') + '</span>' +
        (on ? '<label class="datechip">' + fmtDate(alt.date) + '<input type="date" aria-label="Date earned" data-act="alt-date" value="' + alt.date + '" max="' + td + '"></label><button class="btn ghost" data-act="alt-clear">Clear</button>'
            : '<button class="btn" data-act="alt-set" data-type="' + type + '">Record</button>') + '</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  function reqRow(r){
    var c = s.checks[ckey(rank.id, a.id, r.n)];
    return '<div class="req' + (c ? " on" : "") + '"><button class="tap" data-act="toggle" data-n="' + r.n + '" aria-pressed="' + !!c + '"><span class="box"></span><span class="n">' + esc(r.n) + '</span><span class="t">' + esc(r.text) + '</span></button>' +
      (c ? '<div class="side"><label class="datechip">' + fmtDate(c.date) + '<input type="date" aria-label="Date completed for requirement ' + esc(r.n) + '" data-act="req-date" data-n="' + r.n + '" value="' + c.date + '" max="' + td + '"></label>' + (c.entered ? '<span class="tag">In Scoutbook</span>' : '') + '</div>' : '') + '</div>';
  }
  var loose = a.reqs.filter(function(r){ return !r.group; });
  h += '<h3>Requirements</h3><div class="reqs">' + loose.map(reqRow).join("") + '</div>';
  a.groups.forEach(function(g){
    var rs = a.reqs.filter(function(r){ return r.group === g.id; });
    var got = rs.filter(function(r){ return s.checks[ckey(rank.id, a.id, r.n)]; }).length;
    h += '<div class="grouphead"><span>' + esc(g.label) + '</span><span style="color:' + (got >= g.count ? "var(--ok)" : "var(--ink-3)") + '">' + Math.min(got, g.count) + ' of ' + g.count + '</span></div><div class="reqs">' + rs.map(reqRow).join("") + '</div>';
  });
  return h;
}
function viewQueue(s){
  var groups = queueItems(s);
  if (!groups.length) return '<div class="card empty"><div class="big">All caught up</div><p class="muted">Every completed requirement for ' + esc(s.name) + ' is marked as entered in Scoutbook.</p></div>';
  var h = '<p class="small muted" style="margin-top:0">Items in catalog order, ready to copy into Scoutbook. Mark them entered as you go.</p>';
  var lastRank = null;
  groups.forEach(function(g){
    if (g.rank.id !== lastRank) { h += '<h3 style="color:' + g.rank.color + '">' + esc(g.rank.name) + '</h3>'; lastRank = g.rank.id; }
    var met = requirementsMet(g.rank.id, g.adv, s);
    h += '<div class="card qadv" style="--rk:' + g.rank.color + '"><div class="hd"><div><b>' + esc(g.adv.name) + '</b>' + (met ? ' <span class="tag">Adventure complete ' + fmtDate(adventureDate(g.rank.id, g.adv, s)) + '</span>' : '') + '</div>' +
      '<button class="btn" data-act="enter-adv" data-rank="' + g.rank.id + '" data-id="' + g.adv.id + '">Mark all entered</button></div>';
    g.items.forEach(function(it){
      h += '<div class="qitem"><div class="q">' + (it.kind === "req" ? '<b>Req ' + esc(it.n) + '</b>' + esc(it.label) : '<b>Alternate</b>' + esc(it.label)) + '<div class="xs muted">' + fmtDate(it.date) + '</div></div><button class="btn" data-act="enter-item" data-kind="' + it.kind + '" data-key="' + esc(it.key) + '">Entered</button></div>';
    });
    h += '</div>';
  });
  return h;
}

/* ---------- settings ---------- */
function rankOptions(sel){ return CATALOG.map(function(r){ return '<option value="' + r.id + '"' + (r.id === sel ? " selected" : "") + '>' + esc(r.name) + '</option>'; }).join(""); }
function openSettings(focusAdd){
  var s = active();
  var rows = state.scouts.map(function(x){
    return '<div class="srow"><div class="two"><div class="field" style="margin:0"><label for="nm-' + esc(x.id) + '">Name</label><input class="inp" id="nm-' + esc(x.id) + '" data-act="rename" data-id="' + esc(x.id) + '" value="' + esc(x.name) + '" maxlength="40"></div>' +
      '<div class="field" style="margin:0"><label for="rk-' + esc(x.id) + '">Den this year</label><select class="inp" id="rk-' + esc(x.id) + '" data-act="scout-rank" data-id="' + esc(x.id) + '">' + rankOptions(x.rankId) + '</select></div></div>' +
      '<button class="btn danger" data-act="remove-scout" data-id="' + esc(x.id) + '">Remove</button></div>';
  }).join("");
  var h = '<div class="sheethead"><h2>Settings</h2><button class="btn ghost" data-act="sheet-close">Done</button></div>' +
    '<h3>Scouts</h3>' + (rows || '<p class="small muted">No Scouts yet.</p>') +
    '<div class="card" style="margin-top:10px"><b>Add a Scout</b><div class="field"><label for="newName">Name</label><input class="inp" id="newName" maxlength="40" placeholder="First name"' + (focusAdd ? " autofocus" : "") + '></div>' +
    '<div class="field"><label for="newRank">Den this year</label><select class="inp" id="newRank">' + rankOptions("lion") + '</select></div><div class="btnrow"><button class="btn primary" data-act="add-scout">Add Scout</button></div></div>' +
    '<h3>Backup</h3><p class="small muted">Saved on this device only. Export a backup now and then, and import it on another device or browser.</p>' +
    '<div class="btnrow"><button class="btn" data-act="export">Export backup</button><button class="btn" data-act="import">Import backup</button></div>';
  if (s) h += '<h3>Reset</h3><p class="small muted">Clears every check, alternate, and pin for ' + esc(s.name) + '. Type the name to confirm.</p><div class="field"><label for="resetName">Scout name</label><input class="inp" id="resetName" autocomplete="off" data-act="reset-type"></div><div class="btnrow"><button class="btn danger" id="resetBtn" data-act="reset" disabled>Reset ' + esc(s.name) + '</button></div>';
  openSheet(h, "settings");
}

/* ---------- export and import ---------- */
function exportData(){
  var blob = new Blob([JSON.stringify({app:"appaday167", version:VERSION, exported:today(), activeScoutId:state.activeScoutId, scouts:state.scouts}, null, 2)], {type:"application/json"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "appaday167-backup-" + today() + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
  toast("Backup downloaded");
}
var pendingImport = null;
function handleImport(text){
  var data;
  try { data = JSON.parse(text); } catch (e) { toast("That file is not valid JSON"); return; }
  if (!validState(data)) { toast("That file is not an AppADay 167 backup"); return; }
  pendingImport = {activeScoutId:data.activeScoutId, scouts:data.scouts.map(cleanScout)};
  var nc = 0, na = 0;
  pendingImport.scouts.forEach(function(x){ nc += Object.keys(x.checks).length; na += Object.keys(x.alts).length; });
  openSheet('<div class="sheethead"><h2>Import backup</h2></div><p class="msg">Found ' + pendingImport.scouts.length + ' Scout' + (pendingImport.scouts.length === 1 ? "" : "s") + ', ' + nc + ' checked requirement' + (nc === 1 ? "" : "s") + ', and ' + na + ' alternate' + (na === 1 ? "" : "s") + ' (' + esc(pendingImport.scouts.map(function(x){ return x.name; }).join(", ")) + ').</p>' +
    '<p class="small muted">Replace swaps everything here for the backup. Merge adds the backup to what is here, matching Scouts by name, keeping the earlier date for any item in both, and keeping an item entered if either copy says so.</p>' +
    '<div class="btnrow"><button class="btn primary" data-act="import-replace">Replace</button><button class="btn" data-act="import-merge">Merge</button><button class="btn ghost" data-act="sheet-close">Cancel</button></div>', "import");
}
function mergeItem(a, b){ if (!a) return b; if (!b) return a; var keep = b.date < a.date ? b : a; var o = JSON.parse(JSON.stringify(keep)); o.entered = !!(a.entered || b.entered); return o; }
function mergeState(cur, inc){
  inc.scouts.forEach(function(x){
    var m = null;
    cur.scouts.forEach(function(y){ if (!m && (y.id === x.id || y.name.trim().toLowerCase() === x.name.trim().toLowerCase())) m = y; });
    if (!m) { cur.scouts.push(x); return; }
    Object.keys(x.checks).forEach(function(k){ m.checks[k] = mergeItem(m.checks[k], x.checks[k]); });
    Object.keys(x.alts).forEach(function(k){ m.alts[k] = mergeItem(m.alts[k], x.alts[k]); });
    Object.keys(x.chosenElectives).forEach(function(r){ var u = (m.chosenElectives[r] || []).slice(); x.chosenElectives[r].forEach(function(e){ if (u.indexOf(e) < 0) u.push(e); }); m.chosenElectives[r] = u.slice(0, 2); });
    if (rankIndex(x.rankId) > rankIndex(m.rankId)) m.rankId = x.rankId;
  });
  if (!scoutById(cur.activeScoutId) && cur.scouts.length) cur.activeScoutId = cur.scouts[0].id;
  return cur;
}

/* ---------- actions ---------- */
function setChecked(s, rank, a, n, on){
  var k = ckey(rank.id, a.id, n);
  if (on) s.checks[k] = {date:today(), entered:false}; else delete s.checks[k];
}
function commit(){ save(); render(); }
function act(el, ev){
  var act = el.getAttribute("data-act"), s = active(), rank = ui.rankId ? rankById(ui.rankId) : null;
  var a = rank && ui.advId ? advById(rank, ui.advId) : null;
  switch (act) {
    case "view": ui.view = el.getAttribute("data-v"); if (ui.view === "rank" && s && !ui.rankId) ui.rankId = s.rankId; render(); window.scrollTo(0, 0); break;
    case "scout": state.activeScoutId = el.getAttribute("data-id"); ui.rankId = active().rankId; ui.advId = null; if (ui.view === "adventure") ui.view = "rank"; commit(); break;
    case "open-scout": state.activeScoutId = el.getAttribute("data-id"); ui.rankId = active().rankId; ui.advId = null; ui.view = "rank"; commit(); window.scrollTo(0, 0); break;
    case "rank": ui.rankId = el.getAttribute("data-id"); ui.advId = null; render(); break;
    case "set-rank": s.rankId = el.getAttribute("data-id"); commit(); toast(s.name + " is now in the " + rankById(s.rankId).name + " den"); break;
    case "open-adv": ui.advId = el.getAttribute("data-id"); ui.view = "adventure"; render(); window.scrollTo(0, 0); break;
    case "pin":
      var pins = (s.chosenElectives[rank.id] || []).slice(), id = el.getAttribute("data-id"), i = pins.indexOf(id);
      if (i >= 0) pins.splice(i, 1); else { if (pins.length >= 2) { toast("Two electives are pinned. Unpin one first."); return; } pins.push(id); }
      s.chosenElectives[rank.id] = pins; commit(); break;
    case "toggle":
      var n = el.getAttribute("data-n"), k = ckey(rank.id, a.id, n), c = s.checks[k];
      if (c && c.entered) { confirmBox("Requirement " + n + " of " + a.name + " is already marked as entered in Scoutbook. Uncheck it anyway?", "Uncheck", function(){ setChecked(s, rank, a, n, false); commit(); }, true); return; }
      var wasMet = requirementsMet(rank.id, a, s);
      setChecked(s, rank, a, n, !c); commit();
      if (!wasMet && requirementsMet(rank.id, a, s)) toast(a.name + " complete" + (rankProgress(rank, s).complete ? ". " + rank.name + " rank complete!" : ""));
      break;
    case "alt-set": s.alts[akey(rank.id, a.id)] = {type:el.getAttribute("data-type"), date:today(), entered:false}; commit(); toast(a.name + " complete by alternate"); break;
    case "alt-clear":
      var ak = akey(rank.id, a.id), al = s.alts[ak];
      var doClear = function(){ delete s.alts[ak]; commit(); };
      if (al && al.entered) { confirmBox("This alternate is already marked as entered in Scoutbook. Clear it anyway?", "Clear", doClear, true); return; }
      doClear(); break;
    case "enter-item":
      var kind = el.getAttribute("data-kind"), key = el.getAttribute("data-key"), store = kind === "req" ? s.checks : s.alts;
      if (store[key]) { store[key].entered = true; commit(); toast("Marked entered", function(){ if (store[key]) store[key].entered = false; commit(); }); }
      break;
    case "enter-adv":
      var rk = el.getAttribute("data-rank"), ad = el.getAttribute("data-id"), changed = [];
      Object.keys(s.checks).forEach(function(k2){ if (k2.indexOf(rk + "." + ad + ".") === 0 && !s.checks[k2].entered) { s.checks[k2].entered = true; changed.push(s.checks[k2]); } });
      var ak2 = akey(rk, ad); if (s.alts[ak2] && !s.alts[ak2].entered) { s.alts[ak2].entered = true; changed.push(s.alts[ak2]); }
      commit(); toast(changed.length + " item" + (changed.length === 1 ? "" : "s") + " marked entered", function(){ changed.forEach(function(x){ x.entered = false; }); commit(); });
      break;
    case "undo": if (undoFn) { var f = undoFn; undoFn = null; f(); } document.getElementById("toast").classList.remove("show"); break;
    case "settings": openSettings(false); break;
    case "settings-add": openSettings(true); break;
    case "sheet-close": closeSheet(); break;
    case "dialog-ok": var cb = dialogCb; closeSheet(); if (cb) cb(); break;
    case "add-scout":
      var nm = document.getElementById("newName").value.trim(), nr = document.getElementById("newRank").value;
      if (!nm) { toast("Enter a name first"); return; }
      var ns = {id:uid(), name:nm.slice(0, 40), rankId:nr, checks:{}, alts:{}, chosenElectives:{}};
      state.scouts.push(ns); state.activeScoutId = ns.id; ui.rankId = nr; ui.advId = null; ui.view = "rank"; save(); render(); openSettings(false); toast(nm + " added");
      break;
    case "remove-scout":
      var rid = el.getAttribute("data-id"), rs = scoutById(rid);
      confirmBox("Remove " + rs.name + " and all of their progress? Export a backup first if you might want it back.", "Remove", function(){
        state.scouts = state.scouts.filter(function(x){ return x.id !== rid; });
        if (state.activeScoutId === rid) { state.activeScoutId = state.scouts.length ? state.scouts[0].id : null; ui.rankId = active() ? active().rankId : null; ui.advId = null; ui.view = "summary"; }
        commit(); openSettings(false);
      }, true); break;
    case "export": exportData(); break;
    case "import": document.getElementById("importFile").click(); break;
    case "import-replace":
      state = {version:VERSION, activeScoutId:pendingImport.activeScoutId, scouts:pendingImport.scouts};
      if (!pendingImport.scouts.some(function(x){ return x.id === state.activeScoutId; })) state.activeScoutId = pendingImport.scouts.length ? pendingImport.scouts[0].id : null;
      pendingImport = null; ui = {view:"summary", rankId:null, advId:null}; closeSheet(); commit(); toast("Backup imported"); break;
    case "import-merge": state = mergeState(state, pendingImport); pendingImport = null; ui = {view:"summary", rankId:null, advId:null}; closeSheet(); commit(); toast("Backup merged"); break;
    case "reset":
      if (document.getElementById("resetName").value.trim().toLowerCase() !== s.name.trim().toLowerCase()) return;
      s.checks = {}; s.alts = {}; s.chosenElectives = {}; closeSheet(); commit(); toast(s.name + " reset"); break;
  }
}
document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-act]");
  if (!el || el.tagName === "INPUT" || el.tagName === "SELECT") return;
  act(el, ev);
});
document.getElementById("scrim").addEventListener("click", function(ev){ if (ev.target.id === "scrim") closeSheet(); });
document.addEventListener("keydown", function(ev){ if (ev.key === "Escape" && sheetMode) closeSheet(); });
document.addEventListener("input", function(ev){
  var el = ev.target, a = el.getAttribute("data-act");
  if (a === "reset-type") { var s = active(); document.getElementById("resetBtn").disabled = el.value.trim().toLowerCase() !== s.name.trim().toLowerCase(); }
});
document.addEventListener("change", function(ev){
  var el = ev.target, a = el.getAttribute("data-act"), s = active();
  if (a === "rename") { var x = scoutById(el.getAttribute("data-id")), v = el.value.trim(); if (x && v) { x.name = v.slice(0, 40); save(); render(); } else el.value = x.name; }
  else if (a === "scout-rank") { var y = scoutById(el.getAttribute("data-id")); y.rankId = el.value; if (y === s) { ui.rankId = y.rankId; ui.advId = null; } save(); render(); }
  else if (a === "req-date" || a === "alt-date") {
    var v2 = el.value; if (!isDate(v2) || v2 > today()) { render(); return; }
    var rank = rankById(ui.rankId), adv = advById(rank, ui.advId);
    var rec = a === "req-date" ? s.checks[ckey(rank.id, adv.id, el.getAttribute("data-n"))] : s.alts[akey(rank.id, adv.id)];
    if (rec) { rec.date = v2; commit(); }
  }
  else if (el.id === "importFile") {
    var f = el.files && el.files[0]; if (!f) return;
    var rd = new FileReader(); rd.onload = function(){ handleImport(String(rd.result)); }; rd.readAsText(f); el.value = "";
  }
});

load();
if (active()) ui.rankId = active().rankId;
document.getElementById("banner").hidden = storageOK;
render();
</script>
</body>
